version: 2
project_name: mcp-bridge
builds:
  - main: ./cmd/mcp-bridge
    binary: mcp-bridge
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    files: [README.md, LICENSE]
checksum:
  name_template: checksums.txt
release:
  github:
    owner: holon-sh
    name: mcp-bridge
  make_latest: true
  extra_files:
    - glob: install.sh
changelog:
  disable: true
